<mat-toolbar class="glass-effect shadow-sm mb-4 navbar-premium">
  <div class="navbar-container">
    <div class="brand-group">
      <mat-icon class="brand-icon">dashboard</mat-icon>
      <span class="brand-title">TaskBoard</span>
    </div>

    <div class="actions-group">
      <!-- Dark/Light Theme Button Toggle -->
      <button mat-icon-button (click)="toggleTheme()" class="theme-toggle-btn ripple-btn"
        [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <p (click)="clickMe()">count: {{clickCount}}</p>

      <!-- Create Task Button (Only if user is logged in) -->
      <ng-container *ngIf="currentUser$ | async as user">
        <button mat-raised-button class="create-btn ripple-btn" (click)="createTask.emit()">
          <mat-icon>add</mat-icon>
          <span>Create Task</span>
        </button>

        <!-- User Profile Avatar & Menu -->
        <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-avatar-btn ripple-btn"
          [title]="user.fullName">
          <div class="profile-avatar-initials">
            {{ getUserInitials(user.fullName) }}
          </div>
        </button>
        <mat-menu #profileMenu="matMenu" xPosition="before" class="premium-profile-menu">
          <div class="menu-user-info">
            <div class="menu-user-name">{{ user.fullName }}</div>
            <div class="menu-user-email">{{ user.email }}</div>
          </div>
          <mat-divider></mat-divider>
          <button mat-menu-item (click)="logout()">
            <mat-icon style="color: var(--priority-High);">logout</mat-icon>
            <span>Log Out</span>
          </button>
        </mat-menu>
      </ng-container>
    </div>
  </div>
</mat-toolbar>
