<app-navbar (createTask)="openCreateForm()"></app-navbar>

<app-create-task-form [visible]="formVisible" [taskToEdit]="taskBeingEdited" (submitTask)="handleSubmit($event)"
  (cancel)="closeForm()"></app-create-task-form>

<div class="container-fluid board-container">
  <div class="row g-4" cdkDropListGroup>
    <div class="col-md-4" *ngFor="let column of columns">
      <div class="board-column p-3">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <span class="column-header">
            <mat-icon *ngIf="column.status === 'Todo'" style="color: var(--primary-color);">list_alt</mat-icon>
            <mat-icon *ngIf="column.status === 'In Progress'" style="color: var(--accent-color);">autorenew</mat-icon>
            <mat-icon *ngIf="column.status === 'Done'" style="color: var(--priority-Low);">check_circle</mat-icon>
            {{ column.label }}
          </span>
          <span class="column-header-count">
            {{ (tasksFor(column.status) | async)?.length ?? 0 }}
          </span>
        </div>

        <div cdkDropList [cdkDropListData]="column.status" [id]="column.status" (cdkDropListDropped)="drop($event)"
          class="column-body"
          style="min-height: calc(100vh - 240px); display: flex; flex-direction: column; gap: 1rem;">
          <ng-container *ngIf="tasksFor(column.status) | async as columnTasks">
            <app-task-card *ngFor="let task of columnTasks" [task]="task" cdkDrag [cdkDragData]="task"
              (edit)="openEditForm($event)" (delete)="handleDelete($event)" (start)="handleStart($event)"
              (done)="handleDone($event)"></app-task-card>

            <div class="text-muted small fst-italic text-center my-5" *ngIf="columnTasks.length === 0">
              <mat-icon
                style="font-size: 32px; width: 32px; height: 32px; opacity: 0.5; margin-bottom: 0.5rem;">inbox</mat-icon>
              <div>No tasks in this stage.</div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
  </div>
</div>
